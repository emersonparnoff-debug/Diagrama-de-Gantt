<body class="flex flex-col md:flex-row h-screen overflow-hidden">

    <aside class="w-full md:w-80 bg-gray-800 text-white flex flex-col h-full overflow-y-auto shadow-xl z-10 p-5 shrink-0">
        <h2 class="text-xl font-bold mb-4 border-b border-gray-600 pb-2">📋 Nova Tarefa</h2>
        <form id="formTarefa" class="flex flex-col gap-3 text-sm">
            <input type="hidden" id="tarefaId">
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-gray-300">Nome da Tarefa *</label>
                    <div id="divConfigDiasTrabalho" class="flex gap-2 bg-gray-900 px-2 py-1 rounded border border-gray-700">
                        <label class="text-indigo-400 font-bold text-[10px] flex items-center cursor-pointer" title="Trabalhar ao Sábado">
                            <input type="checkbox" id="trabalhaSabado" class="mr-1 rounded bg-gray-700 border-gray-600 focus:ring-indigo-500"> +Sáb
                        </label>
                        <label class="text-indigo-400 font-bold text-[10px] flex items-center cursor-pointer" title="Trabalhar ao Domingo">
                            <input type="checkbox" id="trabalhaDomingo" class="mr-1 rounded bg-gray-700 border-gray-600 focus:ring-indigo-500"> +Dom
                        </label>
                        <label class="text-indigo-400 font-bold text-[10px] flex items-center cursor-pointer" title="Trabalhar nos Feriados">
                            <input type="checkbox" id="trabalhaFeriado" class="mr-1 rounded bg-gray-700 border-gray-600 focus:ring-indigo-500"> +Fer
                        </label>
                    </div>
                </div>
                <input type="text" id="tarefaNome" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
            </div>
            
            <div>
                <label class="block text-gray-300 mb-1">Fase / Grupo</label>
                <input type="text" id="tarefaFase" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" placeholder="Ex: Engenharia">
            </div>

            <div>
                <label class="block text-gray-300 mb-1">Depende de (Opcional)</label>
                <select id="tarefaDependencia" onchange="aoMudarDependencia()" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500 text-yellow-300">
                    <option value="">Nenhuma</option>
                </select>
            </div>
            
            <div>
                <label class="block text-gray-300 mb-1">Início (Data e Hora) *</label>
                <input type="datetime-local" id="tarefaInicio" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500 transition-all">
                <span id="avisoInicio" class="text-xs text-yellow-400 hidden mt-1">Sincronizado automaticamente.</span>
            </div>

            <div class="p-3 bg-gray-900 rounded border border-gray-700 mt-1">
                <label class="block text-gray-300 mb-2 font-bold">Definir término por:</label>
                <select id="tipoTermino" onchange="alternarModoTermino()" class="w-full p-2 mb-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                    <option value="data">Data Final Exata</option>
                    <option value="duracao" selected>Tempo de Duração (8h/Dia)</option>
                </select>

                <div id="divDataFim" class="hidden">
                    <label class="block text-gray-300 mb-1">Fim (Data e Hora) *</label>
                    <input type="datetime-local" id="tarefaFim" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                </div>

                <div id="divDuracao">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-gray-300 mb-1">Quantidade *</label>
                            <input type="number" id="tarefaDuracao" required min="0.1" step="0.1" value="1" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-gray-300 mb-1">Unidade</label>
                            <select id="tarefaUnidade" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                                <option value="dias">Dias</option>
                                <option value="horas">Horas</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <div>
                <label class="block text-gray-300 mb-1">% Concluído (0-100)</label>
                <input type="number" id="tarefaPercentual" min="0" max="100" value="0" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
            </div>
            
            <div class="flex gap-2 mt-2">
                <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition duration-200">Guardar</button>

        <h3 class="text-lg font-semibold text-gray-200 mb-2">🏖️ Feriados (Próx. 60 dias)</h3>
        
        <div id="listaFeriados60Dias" class="mb-4 bg-gray-900 rounded p-2 text-xs border border-gray-700 max-h-36 overflow-y-auto"></div>

        <label class="block text-gray-400 text-xs mb-1">Adicionar Pausa Extra ou Feriado Municipal:</label>
        <div class="flex gap-2 mb-2 text-sm">
            <input type="date" id="inputFeriado" class="flex-1 p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">

        <hr class="my-5 border-gray-700">

        <h3 class="text-lg font-semibold text-gray-200 mb-3">💾 Estado do Projeto</h3>
        <div id="statusSincronizacao" class="w-full bg-blue-900 text-blue-200 text-center py-2 rounded mb-2 text-sm font-bold shadow-inner">
            A conectar à Nuvem...
        </div>
        
        <div class="flex gap-2 mt-auto">
            <button onclick="baixarProjeto()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-2 rounded transition duration-200 text-xs">Download Backup</button>
            <button onclick="abrirModalConfirmacao('limpar')" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-2 rounded transition duration-200 text-xs">Apagar Tudo</button>

    <main class="flex-1 p-5 relative flex flex-col bg-gray-100 min-w-0">

            <button onclick="abrirModalConfirmacao('excluir')" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">🗑️ Eliminar</button>

    <div id="modalConfirmacao" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-96 shadow-2xl">
            <h3 class="text-lg font-bold text-gray-900 mb-2" id="modalTitulo">Confirmação</h3>

            </div>

    <script>
        // INICIALIZAÇÃO FIREBASE (Chaves do utilizador)
        const firebaseConfig = {
            apiKey: "AIzaSyB7lrHpcHhFd19V7mtG3npWlGrys-_acC8",
            authDomain: "diagrama-de-gantt-ac99d.firebaseapp.com",
            projectId: "diagrama-de-gantt-ac99d",
            storageBucket: "diagrama-de-gantt-ac99d.firebasestorage.app",
            messagingSenderId: "419019374257",
            appId: "1:419019374257:web:b593a4cb2a439e7d2b6c90",
            measurementId: "G-KT7S87X0RH"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const refProjeto = database.ref('cronograma_producao_v1');

        google.charts.load('current', {'packages':['gantt']});
        google.charts.setOnLoadCallback(inicializarApp);

        let dadosProjeto = [];
        let listaFeriados = []; 
        let feriadosNacionais = []; 
        let chart = null, dataTable = null;
        let idTarefaSelecionadaMenu = null, acaoPendenteModal = null; 
        let mouseX = 0, mouseY = 0;
        let requiresScrollToToday = true; 
        
        document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

        function gerarFeriadosNacionais() {
            let feriados = [];
            const nomesFeriadosFixos = { '01-01': 'Ano Novo', '04-21': 'Tiradentes', '05-01': 'Dia do Trabalhador', '09-07': 'Independência', '10-12': 'Nossa Sra. Aparecida', '11-02': 'Finados', '11-15': 'Proc. da República', '11-20': 'Consciência Negra', '12-25': 'Natal' };
            const anoAtual = new Date().getFullYear();
            for (let ano = anoAtual - 1; ano <= anoAtual + 3; ano++) {
                for (const [mesDia, nome] of Object.entries(nomesFeriadosFixos)) feriados.push({ data: `${ano}-${mesDia}`, nome: nome });
                let a = ano % 19, b = Math.floor(ano / 100), c = ano % 100;
                let h = (19 * a + b - Math.floor(b / 4) - Math.floor((b - Math.floor((b + 8) / 25) + 1) / 3) + 15) % 30;
                let l = (32 + 2 * (b % 4) + 2 * Math.floor(c / 4) - h - (c % 4)) % 7;
                let mesP = Math.floor((h + l - 7 * Math.floor((a + 11 * h + 22 * l) / 451) + 114) / 31);
                let diaP = ((h + l - 7 * Math.floor((a + 11 * h + 22 * l) / 451) + 114) % 31) + 1;
                let pascoa = new Date(ano, mesP - 1, diaP);
                let sextaSanta = new Date(pascoa); sextaSanta.setDate(pascoa.getDate() - 2);
                let carnaval = new Date(pascoa); carnaval.setDate(pascoa.getDate() - 47);
                let corpus = new Date(pascoa); corpus.setDate(pascoa.getDate() + 60);
                const format = (dt) => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
                feriados.push({ data: format(sextaSanta), nome: 'Sexta-feira Santa' }, { data: format(carnaval), nome: 'Carnaval' }, { data: format(corpus), nome: 'Corpus Christi' });
            }
            return feriados;
        }

        function verificarFeriado(dataString) {
            let nac = feriadosNacionais.find(f => f.data === dataString);
            if (nac) return nac.nome;
            if (listaFeriados.includes(dataString)) return 'Pausa Customizada';
            return null;
        }

        function inicializarApp() {
            feriadosNacionais = gerarFeriadosNacionais();
            
            // OUVINTE EM TEMPO REAL DO FIREBASE
            refProjeto.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.dadosProjeto) processarJSONLido(JSON.parse(data.dadosProjeto));
                    else dadosProjeto = [];
                    if (data.listaFeriados) listaFeriados = JSON.parse(data.listaFeriados);
                    else listaFeriados = [];
                } else {
                    dadosProjeto = [];
                    listaFeriados = [];
                }
                
                document.getElementById('statusSincronizacao').className = "w-full bg-green-900 text-green-200 text-center py-2 rounded mb-2 text-sm font-bold shadow-inner";
                document.getElementById('statusSincronizacao').innerText = "☁️ Sincronizado com a Nuvem";
                
                renderizarFeriadosUI();
                recalcularCascata(); 
                desenharGrafico();
            }, (errorObject) => {
                document.getElementById('statusSincronizacao').className = "w-full bg-red-900 text-red-200 text-center py-2 rounded mb-2 text-sm font-bold shadow-inner";
                document.getElementById('statusSincronizacao').innerText = "⚠️ Erro de Conexão";
                console.error("Falha na leitura Firebase: " + errorObject.name);
            });

            document.addEventListener('click', function(e) {
                const menu = document.getElementById('menuFlutuante');
                if (!menu.classList.contains('hidden') && !e.target.closest('path') && !e.target.closest('rect')) {
                    menu.classList.add('hidden');
                }
            });
            setInterval(desenharMarcadoresTempo, 60000);
            alternarModoTermino(); 
        }

        function mudarZoom() {
            requiresScrollToToday = true;
            desenharGrafico();
        }

        function adicionarFeriado() {
            const dateInput = document.getElementById('inputFeriado').value;
            if(!dateInput) return;
            if (feriadosNacionais.some(f => f.data === dateInput)) { alert("Esta data já é um Feriado Nacional Automático!"); return; }
            if(!listaFeriados.includes(dateInput)) {
                listaFeriados.push(dateInput);
                listaFeriados.sort(); 
                salvarNaNuvem();
            }
            document.getElementById('inputFeriado').value = '';
        }

        function removerFeriado(dataString) {
            listaFeriados = listaFeriados.filter(f => f !== dataString);
            salvarNaNuvem();
        }

        function renderizarFeriadosUI() {
            const containerCustom = document.getElementById('listaFeriadosUI');
            containerCustom.innerHTML = '';
            listaFeriados.forEach(f => {
                const badge = document.createElement('div');
                badge.className = 'flex items-center bg-gray-700 text-gray-200 text-xs px-2 py-1 rounded border border-gray-600';
                badge.innerHTML = `<span>${f.split('-').reverse().join('/')}</span><button type="button" onclick="removerFeriado('${f}')" class="ml-2 text-red-400 hover:text-red-300 font-bold">&times;</button>`;
                containerCustom.appendChild(badge);
            });
            const container60 = document.getElementById('listaFeriados60Dias');
            const hoje = new Date();
            hoje.setHours(0,0,0,0);
            const daqui60 = new Date(hoje);
            daqui60.setDate(daqui60.getDate() + 60);
            let todos = [...feriadosNacionais];
            listaFeriados.forEach(f => { if(!todos.some(x => x.data === f)) todos.push({ data: f, nome: 'Pausa Customizada' }); });
            todos.sort((a,b) => new Date(a.data) - new Date(b.data));
            let html60 = '', cont = 0;
            todos.forEach(f => {
                const dataObj = new Date(f.data + 'T00:00:00'); 
                if (dataObj >= hoje && dataObj <= daqui60) {
                    const dia = String(dataObj.getDate()).padStart(2,'0'), mes = String(dataObj.getMonth()+1).padStart(2,'0');
                    html60 += `<div class="flex justify-between py-1.5 border-b border-gray-700 last:border-0"><span class="text-indigo-400 font-bold w-12">${dia}/${mes}</span><span class="text-gray-300 flex-1 truncate ml-2" title="${f.nome}">${f.nome}</span></div>`;
                    cont++;
                }
            });
            if(cont === 0) html60 = '<div class="text-gray-500 text-center py-2">Nenhum feriado nos próximos 60 dias.</div>';
            container60.innerHTML = html60;
        }

        function calcularDataFim(inicio, duracaoValor, duracaoUnidade, trabSab, trabDom, trabFer) {
            let horas = duracaoUnidade === 'dias' ? (duracaoValor * 8) : duracaoValor;
            let minutosRestantes = Math.round(horas * 60);
            let atual = new Date(inicio.getTime());
            if (minutosRestantes <= 0) return atual;
            const inicioManha = 8 * 60, fimManha = 12 * 60, inicioTarde = 13 * 60, fimTarde = 17 * 60;    
            while (minutosRestantes > 0) {
                let diaSemana = atual.getDay();
                let isFimSemana = (diaSemana === 0 && !trabDom) || (diaSemana === 6 && !trabSab);
                const a = atual.getFullYear(), m = String(atual.getMonth()+1).padStart(2,'0'), d = String(atual.getDate()).padStart(2,'0');
                let isFeriado = verificarFeriado(`${a}-${m}-${d}`) !== null;
                if (isFimSemana || (isFeriado && !trabFer)) { atual.setDate(atual.getDate() + 1); atual.setHours(8, 0, 0, 0); continue; }
                let horaMinutos = atual.getHours() * 60 + atual.getMinutes();
                if (horaMinutos < inicioManha) { atual.setHours(8, 0, 0, 0); continue; } 
                else if (horaMinutos >= fimManha && horaMinutos < inicioTarde) { atual.setHours(13, 0, 0, 0); continue; } 
                else if (horaMinutos >= fimTarde) { atual.setDate(atual.getDate() + 1); atual.setHours(8, 0, 0, 0); continue; }
                let minutosAtePausa = 0;
                if (horaMinutos < fimManha) minutosAtePausa = fimManha - horaMinutos;
                else if (horaMinutos < fimTarde) minutosAtePausa = fimTarde - horaMinutos;
                let tempoGasto = Math.min(minutosRestantes, minutosAtePausa);
                atual.setMinutes(atual.getMinutes() + tempoGasto);
                minutosRestantes -= tempoGasto;
            }
            return atual;
        }

        function recalcularCascata() {
            let houveMudanca = true, iteracoes = 0;
            const maxIteracoes = dadosProjeto.length + 1; 
            while (houveMudanca && iteracoes < maxIteracoes) {
                houveMudanca = false; iteracoes++;
                for (let t of dadosProjeto) {
                    if (t.dependencia) {
                        const pai = dadosProjeto.find(p => p.id === t.dependencia);
                        if (pai && pai.fim) {
                            if (t.inicio.getTime() !== pai.fim.getTime()) {
                                if (t.tipoTermino === 'data' && t.fim) t.fim = new Date(pai.fim.getTime() + (t.fim.getTime() - t.inicio.getTime()));
                                t.inicio = new Date(pai.fim.getTime());
                                houveMudanca = true; 
                            }
                        }
                    }
                    if(!t.dependencia && t.tipoTermino === 'duracao') {
                        const inicioOriginal = t.inicio.getTime();
                        let inicioTemporario = calcularDataFim(new Date(t.inicio), 0, 'horas', t.trabalhaSabado, t.trabalhaDomingo, t.trabalhaFeriado);
                        if(inicioOriginal !== inicioTemporario.getTime()) { t.inicio = inicioTemporario; houveMudanca = true; }
                    }
                    if (t.tipoTermino === 'duracao') {
                        const novoFim = calcularDataFim(t.inicio, t.duracaoValor, t.duracaoUnidade, t.trabalhaSabado, t.trabalhaDomingo, t.trabalhaFeriado);
                        if (!t.fim || t.fim.getTime() !== novoFim.getTime()) { t.fim = novoFim; houveMudanca = true; }
                    }
                }
            }
        }

        function desenharMarcadoresTempo() {
            const grafico = document.getElementById('grafico_div');
            ['containerFundo', 'containerFrente'].forEach(id => { const el = document.getElementById(id); if (el) el.remove(); });
            if (dadosProjeto.length === 0) return;
            let minDate = new Date(8640000000000000), maxDate = new Date(-8640000000000000);
            dadosProjeto.forEach(t => {
                if (t.inicio < minDate) minDate = new Date(t.inicio);
                if (t.fim && t.fim > maxDate) maxDate = new Date(t.fim);
            });
            const svg = grafico.querySelector('svg');
            if (!svg) return;
            svg.style.position = 'relative';
            svg.style.zIndex = '10';
            svg.style.marginTop = '25px'; 

            const svgRect = svg.getBoundingClientRect();
            let minRelPixel = Infinity, maxRelPixel = -Infinity;
            const elementos = svg.querySelectorAll('rect, path');
            elementos.forEach(el => {
                const rect = el.getBoundingClientRect();
                if (rect.height >= 8 && rect.height <= 50 && rect.width > 2) {
                    if (rect.width > svgRect.width * 0.95) return;
                    const fill = (el.getAttribute('fill') || '').toLowerCase(), stroke = (el.getAttribute('stroke') || '').toLowerCase();
                    const coresIgnoradas = ['none', '#ffffff', '#f5f5f5', '#e6e6e6', '#f9f9f9', '#ebebeb', '#e8e8e8', '#000000'];
                    if (coresIgnoradas.includes(fill)) return; 
                    if (stroke && stroke !== 'none' && stroke !== fill) return; 
                    const relLeft = rect.left - svgRect.left, relRight = rect.right - svgRect.left;
                    if (relLeft < minRelPixel) minRelPixel = relLeft;
                    if (relRight > maxRelPixel) maxRelPixel = relRight;
                }
            });
            if (minRelPixel === Infinity || maxRelPixel === -Infinity || maxRelPixel <= minRelPixel) return;

            let larguraColunaFixa = Infinity;
            svg.querySelectorAll('path').forEach(p => {
                const rect = p.getBoundingClientRect();
                if (rect.height > 30 && rect.width < 5) { 
                    const relX = rect.left - svgRect.left;
                    if (relX > 50 && relX < larguraColunaFixa) larguraColunaFixa = relX;
                }
            });
            if (larguraColunaFixa === Infinity || larguraColunaFixa > svgRect.width / 2) larguraColunaFixa = minRelPixel - 10; 
            const limiteGraficoX = larguraColunaFixa; 

            svg.querySelectorAll('rect').forEach(r => {
                const rectBox = r.getBoundingClientRect();
                if (rectBox.left - svgRect.left > limiteGraficoX - 10 && (rectBox.top - svgRect.top < 45 || rectBox.top - svgRect.top > svgRect.height - 45) && ['#ffffff', '#f5f5f5', '#e6e6e6', '#f9f9f9', '#ebebeb', '#e8e8e8'].includes((r.getAttribute('fill') || '').toLowerCase())) r.setAttribute('fill-opacity', '0');
            });
            svg.querySelectorAll('text').forEach(t => {
                const rectBox = t.getBoundingClientRect();
                if (rectBox.left - svgRect.left > limiteGraficoX - 10 && (rectBox.top - svgRect.top < 45 || rectBox.top - svgRect.top > svgRect.height - 45)) { t.setAttribute('fill-opacity', '0'); t.textContent = ''; }
            });

            const msPorPixel = (maxDate.getTime() - minDate.getTime()) / (maxRelPixel - minRelPixel);
            const pxPorDia = 86400000 / msPorPixel;

            const containerFundo = document.createElement('div'); containerFundo.id = 'containerFundo'; containerFundo.className = 'absolute inset-0 z-0 overflow-hidden pointer-events-none'; grafico.appendChild(containerFundo);
            const containerFrente = document.createElement('div'); containerFrente.id = 'containerFrente'; containerFrente.className = 'absolute inset-0 z-20 overflow-hidden pointer-events-none'; grafico.appendChild(containerFrente);

            let dataCursor = new Date(minDate); dataCursor.setHours(0,0,0,0); dataCursor.setDate(dataCursor.getDate() - 10);
            let dataFimLoop = new Date(maxDate); dataFimLoop.setHours(0,0,0,0); dataFimLoop.setDate(dataFimLoop.getDate() + 20);
            const nomesDias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

            while (dataCursor <= dataFimLoop) {
                const a = dataCursor.getFullYear(), m = String(dataCursor.getMonth()+1).padStart(2,'0'), d = String(dataCursor.getDate()).padStart(2,'0');
                const nomeFeriado = verificarFeriado(`${a}-${m}-${d}`);
                const leftPos = minRelPixel + ((dataCursor.getTime() - minDate.getTime()) / msPorPixel);

                if (leftPos + pxPorDia > limiteGraficoX) {
                    if (nomeFeriado !== null || dataCursor.getDay() === 6 || dataCursor.getDay() === 0) {
                        const fundo = document.createElement('div'); fundo.className = 'absolute top-[30px] bottom-0'; 
                        if (nomeFeriado !== null) fundo.classList.add('bg-red-50'); else fundo.classList.add('bg-slate-100'); 
                        fundo.style.left = leftPos + 'px'; fundo.style.width = pxPorDia + 'px'; containerFundo.appendChild(fundo);
                    }
                    const linhaVertical = document.createElement('div'); linhaVertical.className = 'absolute top-[30px] bottom-0 border-l border-gray-200'; linhaVertical.style.left = leftPos + 'px'; containerFundo.appendChild(linhaVertical);
                    const cabecalho = document.createElement('div'); cabecalho.className = 'absolute top-0 h-[30px] border-b border-l border-gray-300 flex items-center justify-center flex-col shadow-sm';
                    if (nomeFeriado !== null) { cabecalho.classList.add('bg-red-100', 'text-red-700'); cabecalho.title = nomeFeriado; }
                    else if (dataCursor.getDay() === 6 || dataCursor.getDay() === 0) cabecalho.classList.add('bg-slate-200', 'text-slate-600');
                    else cabecalho.classList.add('bg-gray-50', 'text-gray-600');
                    cabecalho.style.left = leftPos + 'px'; cabecalho.style.width = pxPorDia + 'px';
                    cabecalho.innerHTML = `<span class="text-[9px] font-bold uppercase leading-tight ${nomeFeriado !== null ? 'pointer-events-auto cursor-help' : ''}">${nomesDias[dataCursor.getDay()]}</span><span class="text-[9px] leading-tight">${d}/${m}</span>`;
                    containerFrente.appendChild(cabecalho);
                }
                dataCursor.setDate(dataCursor.getDate() + 1);
            }

            const posicaoHojeLeft = minRelPixel + ((new Date().getTime() - minDate.getTime()) / msPorPixel);
            if (posicaoHojeLeft > limiteGraficoX) {
                const linhaHoje = document.createElement('div'); linhaHoje.className = 'absolute top-[30px] bottom-0 w-[2px] bg-red-500 shadow-[0_0_5px_rgba(239,68,68,0.8)] z-50'; linhaHoje.style.left = posicaoHojeLeft + 'px';
                const rotuloHoje = document.createElement('div'); rotuloHoje.innerText = 'Hoje'; rotuloHoje.className = 'absolute top-2 left-1 bg-red-500 text-white px-2 py-0.5 rounded text-[10px] font-bold shadow';
                linhaHoje.appendChild(rotuloHoje); containerFrente.appendChild(linhaHoje);
            }

            let colunaFixa = document.getElementById('coluna_fixa');
            colunaFixa.style.width = limiteGraficoX + 'px';
            colunaFixa.innerHTML = ''; 
            const cloneDiv = grafico.cloneNode(true);
            cloneDiv.querySelectorAll('*').forEach(el => el.removeAttribute('id')); cloneDiv.removeAttribute('id');
            colunaFixa.appendChild(cloneDiv);
            colunaFixa.classList.remove('hidden');

            const scrollW = document.getElementById('scroll_wrapper');
            scrollW.onscroll = () => { const innerClone = colunaFixa.firstElementChild; if (innerClone) innerClone.style.transform = `translateY(-${scrollW.scrollTop}px)`; };

            if (requiresScrollToToday) {
                setTimeout(() => {
                    if (document.getElementById('zoomGrafico').value !== 'auto') {
                        scrollW.scrollTo({ left: Math.max(0, posicaoHojeLeft - (3 * pxPorDia) - limiteGraficoX), behavior: 'smooth' });
                    }
                    requiresScrollToToday = false;
                }, 150);
            }
        }

        function processarJSONLido(jsonArr) {
            dadosProjeto = jsonArr.map(t => ({
                ...t, inicio: new Date(t.inicio), fim: t.fim ? new Date(t.fim) : null, trabalhaSabado: t.trabalhaSabado || false, trabalhaDomingo: t.trabalhaDomingo || false, trabalhaFeriado: t.trabalhaFeriado || false
            }));
        }

        // --- SALVAR DIRETO NO FIREBASE REALTIME DATABASE ---
        function salvarNaNuvem() { 
            document.getElementById('statusSincronizacao').innerText = "A guardar...";
            refProjeto.set({
                dadosProjeto: JSON.stringify(dadosProjeto),
                listaFeriados: JSON.stringify(listaFeriados)
            });
        }

        function alternarModoTermino() {
            const tipo = document.getElementById('tipoTermino').value;
            if (tipo === 'data') {
                document.getElementById('divDataFim').classList.remove('hidden'); document.getElementById('divDuracao').classList.add('hidden');
                document.getElementById('tarefaFim').required = true; document.getElementById('tarefaDuracao').required = false;
            } else {
                document.getElementById('divDataFim').classList.add('hidden'); document.getElementById('divDuracao').classList.remove('hidden');
                document.getElementById('tarefaFim').required = false; document.getElementById('tarefaDuracao').required = true;
            }
        }

        function isDescendente(idAlvo, idAtual) {
            if(idAlvo === idAtual) return true;
            let t = dadosProjeto.find(x => x.id === idAlvo);
            if(!t || !t.dependencia) return false;
            return isDescendente(t.dependencia, idAtual);
        }

        function getDescendentes(id, lista = []) {
            const filhos = dadosProjeto.filter(t => t.dependencia === id);
            filhos.forEach(f => { lista.push(f); getDescendentes(f.id, lista); }); return lista;
        }

        function atualizarSelectDependencias() {
            const select = document.getElementById('tarefaDependencia'), valorAtual = select.value, idAtual = document.getElementById('tarefaId').value;
            select.innerHTML = '<option value="">Nenhuma</option>';
            dadosProjeto.forEach(t => { if (t.id !== idAtual && !isDescendente(t.id, idAtual)) select.innerHTML += `<option value="${t.id}">${t.nome}</option>`; });
            select.value = valorAtual;
        }

        function aoMudarDependencia() {
            const depId = document.getElementById('tarefaDependencia').value, inputInicio = document.getElementById('tarefaInicio'), aviso = document.getElementById('avisoInicio');
            if(depId) {
                document.getElementById('divConfigDiasTrabalho').classList.add('hidden'); 
                const pai = dadosProjeto.find(p => p.id === depId);
                if(pai && pai.fim) {
                    inputInicio.value = `${pai.fim.getFullYear()}-${String(pai.fim.getMonth()+1).padStart(2,'0')}-${String(pai.fim.getDate()).padStart(2,'0')}T${String(pai.fim.getHours()).padStart(2,'0')}:${String(pai.fim.getMinutes()).padStart(2,'0')}`;
                    inputInicio.readOnly = true; inputInicio.classList.add('opacity-50', 'cursor-not-allowed', 'bg-gray-600'); aviso.classList.remove('hidden');
                }
            } else {
                document.getElementById('divConfigDiasTrabalho').classList.remove('hidden'); 
                inputInicio.readOnly = false; inputInicio.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-gray-600'); aviso.classList.add('hidden');
            }
        }

        document.getElementById('formTarefa').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('tarefaId').value || 't_' + Date.now();
            const novaTarefa = { 
                id, nome: document.getElementById('tarefaNome').value, fase: document.getElementById('tarefaFase').value, inicio: new Date(document.getElementById('tarefaInicio').value), 
                percentual: parseInt(document.getElementById('tarefaPercentual').value) || 0, dependencia: document.getElementById('tarefaDependencia').value || null,
                tipoTermino: document.getElementById('tipoTermino').value, trabalhaSabado: document.getElementById('trabalhaSabado').checked, trabalhaDomingo: document.getElementById('trabalhaDomingo').checked,
                trabalhaFeriado: document.getElementById('trabalhaFeriado').checked, fim: null, duracaoValor: null, duracaoUnidade: 'dias'
            };
            if (novaTarefa.tipoTermino === 'data') novaTarefa.fim = new Date(document.getElementById('tarefaFim').value);
            else { novaTarefa.duracaoValor = parseFloat(document.getElementById('tarefaDuracao').value); novaTarefa.duracaoUnidade = document.getElementById('tarefaUnidade').value; }
            const index = dadosProjeto.findIndex(t => t.id === id);
            if (index >= 0) dadosProjeto[index] = novaTarefa; else dadosProjeto.push(novaTarefa);
            
            recalcularCascata(); limparFormulario(); salvarNaNuvem(); requiresScrollToToday = true;
        });

        function limparFormulario() {
            document.getElementById('formTarefa').reset(); document.getElementById('tarefaId').value = ''; document.getElementById('tipoTermino').value = 'duracao'; 
            ['trabalhaSabado', 'trabalhaDomingo', 'trabalhaFeriado'].forEach(id => document.getElementById(id).checked = false);
            alternarModoTermino(); document.getElementById('menuFlutuante').classList.add('hidden'); atualizarSelectDependencias(); aoMudarDependencia(); 
        }

        function editarTarefaMenu() {
            const t = dadosProjeto.find(x => x.id === idTarefaSelecionadaMenu);
            if(t) {
                document.getElementById('tarefaId').value = t.id; document.getElementById('tarefaNome').value = t.nome; document.getElementById('tarefaFase').value = t.fase;
                document.getElementById('tarefaInicio').value = `${t.inicio.getFullYear()}-${String(t.inicio.getMonth()+1).padStart(2,'0')}-${String(t.inicio.getDate()).padStart(2,'0')}T${String(t.inicio.getHours()).padStart(2,'0')}:${String(t.inicio.getMinutes()).padStart(2,'0')}`;
                document.getElementById('tarefaPercentual').value = t.percentual; document.getElementById('tipoTermino').value = t.tipoTermino;
                document.getElementById('trabalhaSabado').checked = t.trabalhaSabado; document.getElementById('trabalhaDomingo').checked = t.trabalhaDomingo; document.getElementById('trabalhaFeriado').checked = t.trabalhaFeriado;
                alternarModoTermino();
                if (t.tipoTermino === 'data') document.getElementById('tarefaFim').value = `${t.fim.getFullYear()}-${String(t.fim.getMonth()+1).padStart(2,'0')}-${String(t.fim.getDate()).padStart(2,'0')}T${String(t.fim.getHours()).padStart(2,'0')}:${String(t.fim.getMinutes()).padStart(2,'0')}`;
                else { document.getElementById('tarefaDuracao').value = t.duracaoValor; document.getElementById('tarefaUnidade').value = t.duracaoUnidade; }
                atualizarSelectDependencias(); document.getElementById('tarefaDependencia').value = t.dependencia || ""; aoMudarDependencia(); 
            }
            document.getElementById('menuFlutuante').classList.add('hidden');
        }

        function getSufixoDiasTrabalho(t) {
            let diasArr = [];
            if (t.trabalhaSabado) diasArr.push('Sáb'); if (t.trabalhaDomingo) diasArr.push('Dom'); if (t.trabalhaFeriado) diasArr.push('Fer');
            if (t.trabalhaSabado && t.trabalhaDomingo && t.trabalhaFeriado) return " 🗓️[Contínuo]";
            else if (diasArr.length > 0) return ` 🗓️[+${diasArr.join(',')}]`;
            return ""; 
        }

        function desenharGrafico() {
            atualizarSelectDependencias();
            const container = document.getElementById('grafico_div');
            ['containerFundo', 'containerFrente'].forEach(id => { const el = document.getElementById(id); if (el) el.remove(); });

            if (dadosProjeto.length === 0) {
                container.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400">Nenhuma tarefa criada.</div>';
                document.getElementById('coluna_fixa').classList.add('hidden');
                return;
            }

            const zoomValue = document.getElementById('zoomGrafico').value;
            const scrollWrapper = document.getElementById('scroll_wrapper');
            let minDateGlobal = new Date(8640000000000000), maxDateGlobal = new Date(-8640000000000000);
            dadosProjeto.forEach(t => { if (t.inicio < minDateGlobal) minDateGlobal = new Date(t.inicio); if (t.fim && t.fim > maxDateGlobal) maxDateGlobal = new Date(t.fim); });

            if (zoomValue === 'auto') container.style.width = '100%';
            else {
                const diasProjeto = (maxDateGlobal.getTime() - minDateGlobal.getTime()) > 0 ? ((maxDateGlobal.getTime() - minDateGlobal.getTime()) / 86400000) : 1;
                const clientWidth = scrollWrapper.clientWidth || 800;
                const gridWidth = clientWidth > 200 ? clientWidth - 200 : clientWidth; 
                container.style.width = Math.max(clientWidth, (gridWidth / parseInt(zoomValue)) * (diasProjeto + 30) + 200) + 'px';
            }

            dataTable = new google.visualization.DataTable();
            dataTable.addColumn('string', 'Task ID'); dataTable.addColumn('string', 'Task Name'); dataTable.addColumn('string', 'Resource'); dataTable.addColumn('date', 'Start Date'); dataTable.addColumn('date', 'End Date'); dataTable.addColumn('number', 'Duration'); dataTable.addColumn('number', 'Percent Complete'); dataTable.addColumn('string', 'Dependencies');

            const linhas = []; const processados = new Set();
            dadosProjeto.filter(t => !t.dependencia || !dadosProjeto.some(p => p.id === t.dependencia)).forEach(root => {
                const familia = [root, ...getDescendentes(root.id)];
                if (familia.length > 1) { // Só cria o Resumo se tiver dependentes
                    let minD = new Date(8640000000000000), maxD = new Date(-8640000000000000), somaPct = 0;
                    familia.forEach(t => { if (t.inicio < minD) minD = new Date(t.inicio); if (t.fim && t.fim > maxD) maxD = new Date(t.fim); somaPct += t.percentual; });
                    linhas.push(['__VIRTUAL__' + root.id, root.nome + ' (Resumo Grupo)', root.fase || 'Resumo', minD, maxD, null, Math.round(somaPct / familia.length), null]);
                }
                familia.forEach(t => { if(!processados.has(t.id)) { linhas.push([t.id, t.nome + getSufixoDiasTrabalho(t), t.fase, t.inicio, t.fim, null, t.percentual, t.dependencia]); processados.add(t.id); } });
            });
            dadosProjeto.forEach(t => { if(!processados.has(t.id)) linhas.push([t.id, t.nome + getSufixoDiasTrabalho(t), t.fase, t.inicio, t.fim, null, t.percentual, t.dependencia]); });

            dataTable.addRows(linhas);
            chart = new google.visualization.Gantt(container);
            google.visualization.events.addListener(chart, 'ready', desenharMarcadoresTempo);
            google.visualization.events.addListener(chart, 'select', function() {
                const selecao = chart.getSelection();
                if (selecao.length > 0) {
                    const idSelecionado = dataTable.getValue(selecao[0].row, 0);
                    if (String(idSelecionado).startsWith('__VIRTUAL__')) { chart.setSelection([]); return; }
                    idTarefaSelecionadaMenu = idSelecionado;
                    const menu = document.getElementById('menuFlutuante');
                    menu.style.left = (mouseX - scrollWrapper.getBoundingClientRect().left + scrollWrapper.scrollLeft) + 'px'; 
                    menu.style.top = (mouseY - scrollWrapper.getBoundingClientRect().top + scrollWrapper.scrollTop + 10) + 'px';
                    menu.classList.remove('hidden');
                }
            });

            chart.draw(dataTable, { height: scrollWrapper.clientHeight ? scrollWrapper.clientHeight - 25 : 500, gantt: { trackHeight: 30, arrow: { width: 2, color: '#4b5563', radius: 0 } } });
        }

        function baixarProjeto() {
            if (dadosProjeto.length === 0) return;
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([JSON.stringify({ tarefas: dadosProjeto, feriados: listaFeriados }, null, 2)], { type: "application/json" }));
            a.download = "projeto_gantt_backup.json"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function abrirModalConfirmacao(acao) {
            acaoPendenteModal = acao; document.getElementById('menuFlutuante').classList.add('hidden');
            document.getElementById('modalTitulo').innerText = acao === 'excluir' ? "Eliminar Tarefa" : "Limpar Projeto";
            document.getElementById('modalConfirmacao').classList.remove('hidden');
        }

        function fecharModal() { document.getElementById('modalConfirmacao').classList.add('hidden'); acaoPendenteModal = null; }

        document.getElementById('modalBtnConfirmar').addEventListener('click', function() {
            if (acaoPendenteModal === 'excluir' && idTarefaSelecionadaMenu) {
                dadosProjeto = dadosProjeto.filter(t => t.id !== idTarefaSelecionadaMenu);
                dadosProjeto.forEach(t => { if (t.dependencia === idTarefaSelecionadaMenu) t.dependencia = null; });
                recalcularCascata();
            } else if (acaoPendenteModal === 'limpar') {
                dadosProjeto = []; listaFeriados = [];
            }
            salvarNaNuvem(); limparFormulario(); fecharModal();
        });

        window.addEventListener('resize', () => { if(dadosProjeto.length > 0) desenharGrafico(); });
    </script>
</body>
